[workspace]
members = ["."]
resolver = "2"

[package]
name = "pulsar-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Pulsar validator proof verification sidecar"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.30", default-features = false, features = ["process", "signal", "user"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
