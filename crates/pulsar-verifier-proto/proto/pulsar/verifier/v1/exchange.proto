syntax = "proto3";

package pulsar.verifier.v1;

import "pulsar/verifier/v1/proof.proto";

// Requests complete proof content by its canonical verification ID.
message GetProofRequest {
  string chain_id = 1;
  bytes verification_id = 2;
}

// Returns either the complete proof package or an explicit cache miss.
message GetProofResponse {
  string chain_id = 1;

  oneof result {
    Proof proof = 2;
    ProofNotFound not_found = 3;
  }
}

message ProofNotFound {}
