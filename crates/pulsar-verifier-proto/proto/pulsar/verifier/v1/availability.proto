syntax = "proto3";

package pulsar.verifier.v1;

// Carries one small availability operation on the chain-specific topic.
message AvailabilityMessage {
  string chain_id = 1;

  oneof payload {
    AvailabilityAnnouncement announcement = 2;
    AvailabilityQuery query = 3;
    AvailabilityResponse response = 4;
  }
}

// Announces that the authenticated source peer currently stores the proof.
message AvailabilityAnnouncement {
  bytes verification_id = 1;
}

// Asks peers to return providers already known for the verification.
message AvailabilityQuery {
  bytes request_id = 1;
  bytes verification_id = 2;
}

// Returns authorized provider hints; the responder need not own the proof.
message AvailabilityResponse {
  bytes request_id = 1;
  bytes verification_id = 2;
  repeated bytes provider_peer_ids = 3;
}
