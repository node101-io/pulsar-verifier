syntax = "proto3";
package pulsarchain.verification.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "pulsarchain/verification/v1/params.proto";
import "pulsarchain/verification/v1/types.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/verification/types";

// Query exposes verification module state.
service Query {
  // Params returns module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/params";
  }
  // Proof returns a pending or finalized proof by key.
  rpc Proof(QueryProofRequest) returns (QueryProofResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/proofs/{submission_height}/{index_in_block}";
  }
  // ProofByVerificationId resolves the permanent verification request registry.
  rpc ProofByVerificationId(QueryProofByVerificationIdRequest) returns (QueryProofResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/proofs/verification-id/{verification_id}";
  }
  // ProofsByHeight lists proofs submitted at a height.
  rpc ProofsByHeight(QueryProofsByHeightRequest) returns (QueryProofsByHeightResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/proofs/height/{submission_height}";
  }
  // Commitment returns one retained validator commitment.
  rpc Commitment(QueryCommitmentRequest) returns (QueryCommitmentResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/commitments/{validator}/{commitment_height}";
  }
  // CommitmentsByValidator lists retained commitments for a validator.
  rpc CommitmentsByValidator(QueryCommitmentsByValidatorRequest) returns (QueryCommitmentsByValidatorResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/commitments/{validator}";
  }
  // Vote returns one validator's effective vote for a proof.
  rpc Vote(QueryVoteRequest) returns (QueryVoteResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/votes/{submission_height}/{index_in_block}/{validator}";
  }
  // VerificationVotes lists effective votes for a proof.
  rpc VerificationVotes(QueryVerificationVotesRequest) returns (QueryVerificationVotesResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/votes/{submission_height}/{index_in_block}";
  }
  // ProofTally returns the active tally for a pending proof.
  rpc ProofTally(QueryProofTallyRequest) returns (QueryProofTallyResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/tallies/{submission_height}/{index_in_block}";
  }
  // FinalProofResult returns an immutable finalized result.
  rpc FinalProofResult(QueryFinalProofResultRequest) returns (QueryFinalProofResultResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/verification/v1/results/{submission_height}/{index_in_block}";
  }
}

// QueryParamsRequest requests verification parameters.
message QueryParamsRequest {}

// QueryParamsResponse contains verification parameters.
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// QueryProofRequest identifies a proof by key.
message QueryProofRequest {
  uint64 submission_height = 1;
  uint32 index_in_block = 2;
}

// QueryProofByVerificationIdRequest identifies a proof by its permanent request ID.
message QueryProofByVerificationIdRequest {
  bytes verification_id = 1;
}

// QueryProofResponse contains either pending or finalized proof state.
message QueryProofResponse {
  ProofKey proof_key = 1 [(gogoproto.nullable) = false];
  // state is pending before finalization and final_result afterwards.
  oneof state {
    ProofRecord pending = 2 [(amino.oneof_name) = "pulsarchain/verification/Pending"];
    FinalProofResult final_result = 3 [(amino.oneof_name) = "pulsarchain/verification/Final"];
  }
}

// QueryProofsByHeightRequest selects a proof submission height.
message QueryProofsByHeightRequest {
  uint64 submission_height = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryProofsByHeightResponse contains a page of proofs.
message QueryProofsByHeightResponse {
  repeated QueryProofResponse proofs = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryCommitmentRequest identifies a validator commitment.
message QueryCommitmentRequest {
  string validator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 commitment_height = 2;
}

// QueryCommitmentResponse contains one retained commitment.
message QueryCommitmentResponse {
  CommitmentEntry commitment = 1 [(gogoproto.nullable) = false];
}

// QueryCommitmentsByValidatorRequest selects a validator.
message QueryCommitmentsByValidatorRequest {
  string validator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryCommitmentsByValidatorResponse contains retained commitments.
message QueryCommitmentsByValidatorResponse {
  repeated CommitmentEntry commitments = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryVoteRequest identifies one validator vote.
message QueryVoteRequest {
  uint64 submission_height = 1;
  uint32 index_in_block = 2;
  string validator = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryVoteResponse contains one effective vote.
message QueryVoteResponse {
  VerificationVoteEntry vote = 1 [(gogoproto.nullable) = false];
}

// QueryVerificationVotesRequest identifies a proof's vote set.
message QueryVerificationVotesRequest {
  uint64 submission_height = 1;
  uint32 index_in_block = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

// QueryVerificationVotesResponse contains effective votes.
message QueryVerificationVotesResponse {
  repeated VerificationVoteEntry votes = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryProofTallyRequest identifies a pending proof tally.
message QueryProofTallyRequest {
  uint64 submission_height = 1;
  uint32 index_in_block = 2;
}

// QueryProofTallyResponse contains a pending proof tally.
message QueryProofTallyResponse {
  ProofKey proof_key = 1 [(gogoproto.nullable) = false];
  ProofTally tally = 2 [(gogoproto.nullable) = false];
}

// QueryFinalProofResultRequest identifies a finalized proof.
message QueryFinalProofResultRequest {
  uint64 submission_height = 1;
  uint32 index_in_block = 2;
}

// QueryFinalProofResultResponse contains an immutable proof result.
message QueryFinalProofResultResponse {
  ProofKey proof_key = 1 [(gogoproto.nullable) = false];
  FinalProofResult final_result = 2 [(gogoproto.nullable) = false];
}
